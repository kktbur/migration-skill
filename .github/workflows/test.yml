name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile deterministic scripts
        run: >-
          python -c "from pathlib import Path; import py_compile;
          [py_compile.compile(str(path), doraise=True) for path in Path('skills/migration-skill/scripts').glob('*.py')]"

      - name: Validate Skill package
        run: python skills/migration-skill/scripts/validate_skill.py --root skills/migration-skill

      - name: Replay dependency-free published benchmarks
        if: runner.os != 'Windows'
        run: >-
          python benchmarks/run_regression.py
          --root .
          --run-id 20260831-python-cli-to-node-cli-001
          --run-id 20260831-commonjs-to-esm-001
          --output regression-smoke.json

      - name: Compile lifecycle probe
        run: >-
          python -m py_compile
          tests/plugin_lifecycle/lifecycle_support.py
          tests/plugin_lifecycle/run_host_lifecycle.py

  benchmark-regression:
    name: benchmark-regression / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark-only dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          -r benchmarks/cases/flask-to-fastapi/requirements.txt

      - name: Replay all published benchmarks
        run: >-
          python benchmarks/run_regression.py
          --root .
          --matrix benchmarks/regression-matrix.json
          --output regression-report-ci.json

      - name: Require 3/3 VERIFIED benchmark results
        run: >-
          python -c
          "import json; report=json.load(open('regression-report-ci.json', encoding='utf-8')); assert report['status']=='passed' and report['summary']=={'total':3,'passed':3,'failed':0,'blocked':0,'invalid':0} and all(item.get('evaluator',{}).get('status')=='VERIFIED' for item in report['runs'])"

      - name: Upload benchmark regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression-report
          path: regression-report-ci.json
