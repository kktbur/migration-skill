name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile deterministic scripts
        run: >-
          python -c "from pathlib import Path; import py_compile;
          [py_compile.compile(str(path), doraise=True) for path in Path('scripts').glob('*.py')]"

      - name: Validate Skill package
        run: python scripts/validate_skill.py --root .
